version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: memorybook-postgres
    environment:
      POSTGRES_USER: memorybook
      POSTGRES_PASSWORD: memorybook
      POSTGRES_DB: memorybook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorybook"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: memorybook-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memorybook-backend
    environment:
      DATABASE_URL: postgresql://memorybook:memorybook@postgres:5432/memorybook
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/storage/images
      THUMBNAIL_DIR: /app/storage/thumbnails
    volumes:
      - ./storage/images:/app/storage/images
      - ./storage/thumbnails:/app/storage/thumbnails
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memorybook-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

